<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>New case code</title>
  <style>
    :root {
      --spruce: #1E332A; --paper: #FAFAF7; --gold: #E0A32E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--paper); color: var(--spruce);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      padding: 1.5rem;
    }
    .card { text-align: center; max-width: 30rem; }
    h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
    p.sub { color: rgba(30,51,42,0.7); margin: 0 0 2rem; font-size: 0.95rem; }
    .code {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 2.6rem; letter-spacing: 0.12em; font-weight: 700;
      background: #fff; border: 2px solid rgba(30,51,42,0.12);
      border-radius: 14px; padding: 1.2rem 1rem; margin-bottom: 1.25rem;
      user-select: all;
    }
    .row { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    button {
      font: inherit; font-weight: 700; font-size: 1rem;
      padding: 0.75rem 1.6rem; border-radius: 999px; cursor: pointer;
      border: 2px solid var(--spruce);
    }
    .gold { background: var(--gold); border-color: var(--gold); color: var(--spruce); }
    .outline { background: transparent; color: var(--spruce); }
    .hint { margin-top: 2rem; font-size: 0.85rem; color: rgba(30,51,42,0.55); line-height: 1.6; }
    .full { font-family: ui-monospace, monospace; word-break: break-all; }
    .copied { color: var(--gold); font-weight: 700; height: 1.2rem; margin-top: 0.75rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>New case code</h1>
    <p class="sub">Copy this, paste it into the case's “Link code” field, then share the full link with the finder.</p>
    <div class="code" id="code">–––––––</div>
    <div class="row">
      <button class="gold" onclick="copyCode()">Copy code</button>
      <button class="outline" onclick="gen()">Get another</button>
    </div>
    <div class="copied" id="copied"></div>
    <p class="hint">
      Full link will be:<br />
      <span class="full">https://secondflight.org/case/<span id="full">–––––––</span></span>
    </p>
  </div>

  <script>
    // 7 lowercase alphanumerics, ambiguous characters (0 o 1 l i) removed,
    // drawn from crypto-strong randomness.
    var ALPHABET = 'abcdefghjkmnpqrstuvwxyz23456789';
    function gen() {
      var out = '';
      var buf = new Uint32Array(7);
      crypto.getRandomValues(buf);
      for (var i = 0; i < 7; i++) out += ALPHABET[buf[i] % ALPHABET.length];
      document.getElementById('code').textContent = out;
      document.getElementById('full').textContent = out;
      document.getElementById('copied').textContent = '';
    }
    function copyCode() {
      var code = document.getElementById('code').textContent;
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById('copied').textContent = 'Copied ✓';
      });
    }
    gen();
  </script>
</body>
</html>
